services:
  # FastAPI Backend Web Service
  - type: web
    name: skyeview-backend
    env: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skyeview-db
          property: connectionString
      - key: WEBODM_MOCK_MODE
        value: "True"
      - key: SECRET_KEY
        generateValue: true

databases:
  # Managed PostgreSQL Database for persistent data storing
  - name: skyeview-db
    plan: free
    postgresVersion: 15
